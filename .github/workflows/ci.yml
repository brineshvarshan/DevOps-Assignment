name: CI Pipeline

on:
  push:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Backend - install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Backend - run tests
        working-directory: backend
        run: |
          pytest

      - name: Frontend - install dependencies
        working-directory: frontend
        run: |
          npm install

      - name: Frontend - run tests
        working-directory: frontend
        run: |
          npm test || echo "No frontend tests yet"

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t backend-app:ci ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t frontend-app:ci ./frontend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and Push Backend Image to ECR
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker tag backend-app:ci 998105438082.dkr.ecr.ap-south-1.amazonaws.com/backend-app:$IMAGE_TAG
          docker push 998105438082.dkr.ecr.ap-south-1.amazonaws.com/backend-app:$IMAGE_TAG

      - name: Tag and Push Frontend Image to ECR
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker tag frontend-app:ci 998105438082.dkr.ecr.ap-south-1.amazonaws.com/frontend-app:$IMAGE_TAG
          docker push 998105438082.dkr.ecr.ap-south-1.amazonaws.com/frontend-app:$IMAGE_TAG
